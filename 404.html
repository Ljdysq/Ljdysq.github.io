<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面走丢了 · 你的昵称</title>

  <!-- 主题初始化：与 index.html 保持一致 -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) { /* 忽略隐私模式下可能的异常 */ }
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ma-shan-zheng@5/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/600.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/700.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%234f7fe8'/%3E%3C/svg%3E">
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换亮色 / 暗色主题" title="切换主题（快捷键 T）">🌙</button>

  <main class="container">
    <div class="notfound">
      <p class="notfound-code">404</p>
      <p class="notfound-text">这页纸好像被风吹走了……</p>
      <a class="btn-accent" href="./">← 回到首页</a>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
